name: R10 evidence pack (scratch, do not merge)
on:
  workflow_dispatch:
  push:
    branches: [r10-audit-scratch]
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PTV Global live capture + OnTVTonight equivalence + mjunoon/Sling same-day checks
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: |
          set -x
          mkdir -p /tmp/r10
          cd /tmp/r10
          # ---------- 1) provider login + PTV Global stream URL ----------
          for proto in https http; do
            B="$proto://${IPTV_SERVER}"
            R=$(curl -sk -m 30 -A "Mozilla/5.0" "$B/player_api.php?username=${IPTV_USER}&password=${IPTV_PASS}" || true)
            echo "$R" > login_$proto.json
            if echo "$R" | grep -q '"user_info"'; then echo "LOGIN_OK $proto"; BASE="$B"; break; fi
          done
          echo "BASE=$BASE" >> vars.txt
          # stream list, find PTV Global (618130)
          curl -sk -m 60 -A "Mozilla/5.0" "$BASE/player_api.php?username=${IPTV_USER}&password=${IPTV_PASS}&action=get_live_streams" > streams.json
          python3 - <<'EOF'
          import json
          d = json.load(open('streams.json'))
          for s in d:
              if s.get('stream_id') in (618130,):
                  print(s.get('name'), json.dumps(s)[:400])
          EOF
          # build the direct stream URL
          python3 - <<'EOF' > ptv_url.txt
          import json, os
          # xtream direct: {base}/live/{user}/{pass}/{id}.ts
          base = os.environ.get('BASE', '')
          print(f"{base}/live/{os.environ['IPTV_USER']}/{os.environ['IPTV_PASS']}/618130.ts")
          EOF
          export BASE
          URL=$(python3 -c "import os; print(f\"{os.environ['BASE']}/live/{os.environ['IPTV_USER']}/{os.environ['IPTV_PASS']}/618130.ts\")")
          echo "URL=$URL" >> vars.txt
          # ---------- 2) 45s capture ----------
          ffmpeg -hide_banner -loglevel error -y -i "$URL" -t 45 -c copy ptvg.ts || ffmpeg -hide_banner -loglevel error -y -i "$URL" -t 45 -c copy ptvg.ts
          ls -la ptvg.ts
          # subtitles? OCR-able graphics may exist; extract closed subs if present
          ffprobe -v error -show_entries stream=index,codec_type:stream_codec=dvb_subtitle -of json ptvg.ts > ptvg_streams.json
          cat ptvg_streams.json
          # ---------- 3) OnTVTonight now-row ----------
          curl -sk -m 30 -A "Mozilla/5.0" -o ott_today.html "https://www.ontvtonight.com/guide/listings/channel/295630262/ptv-global.html?dt=$(date -u +%Y-%m-%d)"
          python3 - <<'EOF'
          import re
          from datetime import datetime, timezone, timedelta
          h = open('ott_today.html', errors='ignore').read()
          rows = re.findall(r'ott-channel-time">\s*(\d{1,2}:\d{2})\s*(am|pm)\s*</h5>.{0,600}?ott-channel-show__title">\s*<a[^>]*>\s*([^<]{2,70})', h, re.S|re.I)
          et = timezone(timedelta(hours=-4))
          now = datetime.now(timezone.utc).astimezone(et)
          cur = None
          for t, ap, title in rows:
              hh, mm = map(int, t.split(':'))
              hh = hh % 12 + (12 if ap.lower()=='pm' else 0)
              if hh*60+mm <= now.hour*60+now.minute: cur = (f"{hh:02d}:{mm:02d}", title.strip())
          print('OTT rows:', len(rows), 'NOW_ET:', f"{now:%H:%M}", 'ON_AIR:', cur)
          open('ott_now.txt','w').write(f"{cur}\n")
          EOF
          # ---------- 4) geo probes: SHOQ/ptv.com.pk/tvnation partner ----------
          for u in "https://www.shoq.com.pk/" "https://ptv.com.pk/" "https://partner.tvnation.com/site/login" "https://my.stormfiber.com/" "https://tvnation.com/gethd/"; do
            echo "===== $u ====="
            curl -sk -m 20 -A "Mozilla/5.0" -o page.html -w "HTTP %{http_code} size %{size_download}\n" "$u" || echo CURL_FAIL
            head -c 600 page.html; echo
          done
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-evidence
          path: /tmp/r10
