name: R10 PK geo probe 2 (scratch, do not merge)
on:
  workflow_dispatch:
  push:
    branches: [r10-audit-scratch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Deeper tvnation + channel lineup hunt from CI
        run: |
          set -e
          fetch() { echo "===== $2 ====="; curl -sk -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o /tmp/o -w "HTTP %{http_code} size %{size_download}\n" "$1" || echo CURL_FAIL; head -c 1500 /tmp/o; echo; echo; }
          # full homepage - look for channel lineup / EPG links
          fetch "https://tvnation.com/" "tvnation.com home (full)"
          fetch "https://tvnation.com/wp-json/wp/v2/pages?per_page=100" "wp-json pages"
          fetch "https://tvnation.com/wp-json/wp/v2/posts?per_page=50" "wp-json posts"
          # try likely lineup/EPG pages
          for p in channel-lineup lineup channels epg tv-guide guide schedule; do
            fetch "https://tvnation.com/$p/" "page /$p/"
          done
          # partner portal structure probes (Yii): known controller names
          for p in site/index site/login channel/index epg/index lineup/index; do
            fetch "https://partner.tvnation.com/$p" "partner /$p"
          done
