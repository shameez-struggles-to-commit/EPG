name: Build EPG Guide

on:
  schedule:
    # 04:00 UTC daily (midnight-ish for most timezones)
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# AUDIT-4 F-02/F-12: one build at a time; a queued (older) run is cancelled so
# a slow stale build can never publish over a newer one.
concurrency:
  group: epg-build
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Install iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/iptv-org-epg
          cd /tmp/iptv-org-epg && npm install --no-audit --no-fund

      - name: Fetch provider data (Xtream)
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: |
          python3 pipeline/fetch_provider.py ./data
          # AUDIT-4 F-02: reject an unexplained near-empty/truncated lineup.
          python3 - <<'PYEOF'
          import json, sys
          streams = json.load(open('data/streams.json'))
          n = len(streams)
          print(f'provider streams: {n}')
          if n < 5000:
              print(f'FAIL: provider lineup implausibly small ({n} < 5000)')
              sys.exit(1)
          PYEOF

      - name: Run PK scrapers (Pakistan)
        run: python3 scrapers/pk_scrapers.py ./data/pk_epg.json || echo "PK scraper(s) failed — see alert step"

      - name: Alert on PK scraper failure (no-LLM)
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess
          try:
              status = json.load(open('data/pk_status.json'))
          except Exception:
              status = {}
          failed = [k for k, s in status.items() if not s.get('ok')]
          if failed:
              msg = "⚠️ EPG PK scraper(s) failed: " + ", ".join(f"{k}={status[k]['count']}" for k in failed)
              ntfy = os.environ.get('NTFY_URL',''); tok = os.environ.get('NTFY_TOKEN','')
              if ntfy and tok:
                  try:
                      subprocess.run(['curl','-s','--max-time','10','-H','Authorization: Bearer '+tok,'-d',msg,f'{ntfy}/hermes-shameez-a7f9c2'], timeout=15)
                  except Exception as e:
                      print(f'ntfy send failed (non-fatal): {e}')
              print(msg)
          else:
              print('all PK scrapers OK')
          PYEOF

      - name: Generate filtered channel lists (non-India iptv-org sites)
        run: python3 pipeline/make_iptvorg_channels.py data/streams.json data/io_channels

      - name: "Fetch all EPG sources (parallel: India + non-India grabs + custom fetchers)"
        run: |
          cd /tmp/iptv-org-epg
          WS="$GITHUB_WORKSPACE"
          mkdir -p "$WS/data"

          # --- all iptv-org grabs: bounded concurrency + per-job status ---
          # AUDIT-6: wait -n discarded exit statuses and missing outputs were
          # warnings. Track every launched job and fail this fetch stage when a
          # non-empty filtered channel list produces no usable output.
          IO_PIDS=(); IO_FILES=(); IO_POLICY=(); IO_DONE=(); IO_FAIL=0
          run_io() {
            local out="$1"; local policy="$2"; shift 2
            "$@" &
            IO_PIDS+=("$!"); IO_FILES+=("$out"); IO_POLICY+=("$policy")
          }
          reap_first() {
            local pid="${IO_PIDS[0]}"
            local out="${IO_FILES[0]}"
            local policy="${IO_POLICY[0]}"
            if ! wait "$pid"; then
              if [ "$policy" = "required" ]; then
                IO_FAIL=1; echo "required iptv-org grab failed: $out"
              else
                echo "DEGRADED optional iptv-org grab failed: $out"
              fi
            fi
            IO_DONE+=("$out")
            IO_PIDS=("${IO_PIDS[@]:1}"); IO_FILES=("${IO_FILES[@]:1}"); IO_POLICY=("${IO_POLICY[@]:1}")
          }

          # India per-site grabs (per-site avoids numeric-id collisions).
          UNFILTERED_JOBS="$(python3 "$WS/pipeline/source_registry.py" list-iptv-org --unfiltered --pairs)"
          [ -n "$UNFILTERED_JOBS" ] || { echo "source registry returned no unfiltered jobs"; exit 1; }
          while IFS='|' read -r site output policy min_programmes; do
            run_io "$WS/data/$output" "$policy" npm run grab -- --sites="$site" --maxConnections=4 --output="$WS/data/$output"
          done <<< "$UNFILTERED_JOBS"

          # Remaining non-India sites (throttled to six in flight).
          FILTERED_JOBS="$(python3 "$WS/pipeline/source_registry.py" list-iptv-org --filtered --pairs)"
          [ -n "$FILTERED_JOBS" ] || { echo "source registry returned no filtered jobs"; exit 1; }
          while IFS='|' read -r site output policy min_programmes; do
            CH="$WS/data/io_channels/$site.channels.xml"
            if [ -s "$CH" ]; then
              OUT="$WS/data/$output"
              run_io "$OUT" "$policy" npx tsx scripts/commands/epg/grab.ts --channels="$CH" --output="$OUT" --days=2 --timeout=30000 --maxConnections=10
            else
              echo "skip $site (empty filter)"
            fi
            if [ "${#IO_PIDS[@]}" -ge 6 ]; then reap_first; fi
          done <<< "$FILTERED_JOBS"
          while [ "${#IO_PIDS[@]}" -gt 0 ]; do reap_first; done
          [ "$IO_FAIL" = "0" ] || { echo "one or more required iptv-org grabs failed"; exit 1; }
          python3 "$WS/pipeline/source_registry.py" validate-outputs \
            --prefix "$WS/data" --status-out "$WS/data/iptv_org_status.json"

          # --- custom fetchers (background; only need streams.json) ---
          # AUDIT-4 F-02: bare `wait` returned 0 even when a child failed.
          # Capture PIDs and check each exit code; REQUIRED fetchers fail the
          # build; optional ones log loudly. epg.one is optional (bonus CIS
          # source; its mirrors are flaky by nature).
          cd "$WS"
          declare -A FETCH_PID FETCH_NAME FETCH_REQ
          run_fetch() {  # name, required(0/1), cmd...
            local name="$1"; local req="$2"; shift 2
            "$@" & FETCH_PID[$!]=$name; FETCH_REQ[$name]=$req; FETCH_NAME[$!]=$name
          }
          run_fetch skyhawk   1 python3 pipeline/fetch_skyhawk.py data/streams.json data/skyhawk.xml --days 2
          run_fetch dstv      1 python3 pipeline/fetch_dstv.py data/dstv.xml --days 2
          run_fetch epgone    0 python3 pipeline/fetch_epgone.py data/epgone_cis.xml data/streams.json
          run_fetch allente   1 python3 pipeline/fetch_allente.py data/allente.xml --days 2
          run_fetch teamfix   1 python3 pipeline/fetch_teamfixtures.py data/streams.json data/teamfixtures.xml data/teams_claim.json data/teams_status.json
          run_fetch bbcradio  1 python3 pipeline/fetch_bbcradio.py data/streams.json data/bbcradio.xml data/bbc_status.json --days 2

          # iptv-org grabs keep their own loop above; wait everything else,
          # then verify the custom fetchers by PID.
          FAIL=0
          for pid in "${!FETCH_PID[@]}"; do
            if ! wait "$pid"; then
              name="${FETCH_PID[$pid]}"
              if [ "${FETCH_REQ[$name]}" = "1" ]; then
                echo "REQUIRED fetcher failed: $name (pid $pid)"; FAIL=1
              else
                echo "optional fetcher failed: $name (non-fatal)"
              fi
            fi
          done
          [ "$FAIL" = "0" ] || { echo "failing build: required fetcher(s) exited non-zero"; exit 1; }

          # required OUTPUT validation: exit 0 + non-empty valid XMLTV file
          python3 - <<'PYEOF'
          import os, re, sys
          # (minimum channels, minimum programmes) — zero-programme <tv/> output
          # is a fetch failure, not a valid empty sports day.
          req = {
              'skyhawk.xml': (10, 100), 'dstv.xml': (10, 100),
              'allente.xml': (1, 10), 'teamfixtures.xml': (1, 1),
              'bbcradio.xml': (1, 1),
          }
          failures=[]
          for f,(min_ch,min_pr) in req.items():
              p=os.path.join('data',f)
              if not os.path.exists(p) or not os.path.getsize(p):
                  failures.append(f'{f}: missing/empty'); continue
              txt=open(p,errors='ignore').read()
              ch=len(re.findall(r'<channel\b',txt)); pr=len(re.findall(r'<programme\b',txt))
              print(f'{f}: {ch} channels, {pr} programmes')
              if ch < min_ch or pr < min_pr:
                  failures.append(f'{f}: {ch} channels/{pr} programmes below {min_ch}/{min_pr}')
          if failures:
              print('\\n'.join('FAIL '+x for x in failures)); sys.exit(1)
          PYEOF
          echo "=== grab outputs ==="
          ls -la "$WS"/data/io_*.xml 2>/dev/null | head -50 || true
          # sanity check: warn (non-fatal) about missing/empty grab outputs
          python3 - "$WS/data" <<'PYEOF'
          import os, sys
          d = sys.argv[1]
          expected = __import__('subprocess').check_output([
              sys.executable, os.path.join(os.environ['GITHUB_WORKSPACE'], 'pipeline/source_registry.py'),
              'outputs'
          ], text=True).split()
          missing = [f for f in expected if not os.path.exists(os.path.join(d, f)) or os.path.getsize(os.path.join(d, f)) < 1024]
          print(f'WARN: {len(missing)} grab outputs missing/empty: {missing}' if missing else 'all grab outputs present')
          PYEOF

      - name: Download epg.pw + epgshare01 + index sources
        env:
          SKYHAWK_FILE: "data/skyhawk.xml"
          DSTV_FILE: "data/dstv.xml"
          EPGONE_FILE: "data/epgone_cis.xml"
          ALLENTE_FILE: "data/allente.xml"
          TEAMS_FILE: "data/teamfixtures.xml"
          BBCRADIO_FILE: "data/bbcradio.xml"
        run: |
          IPTV_ORG_FILES="$(python3 pipeline/source_registry.py files --prefix data --usable-only)"
          [ -n "$IPTV_ORG_FILES" ] || { echo "source registry returned no usable iptv-org files"; exit 1; }
          export IPTV_ORG_FILES
          python3 pipeline/fetch_sources.py ./data

      - name: "Required-source gate (fail-closed)"
        run: |
          python3 - <<'PYEOF'
          import json, os, gzip, re, sys
          # AUDIT-4 F-02: a missing/empty source previously produced a
          # "successful" manifest. Required sources must exist, be non-empty,
          # parse, and carry programmes; a failure here stops the deploy.
          REQUIRED = {
              'epgpw_global.xml.gz':   ('epg.pw', 100),
              'es_US_LOCALS1.xml.gz': ('epgshare01 US locals', 100),
              'es_UK1.xml.gz':        ('epgshare01 UK', 10),
          }
          REQUIRED_PLAIN = {'provider.xml': ('provider XMLTV', 100)}
          # key source-index entries that MUST be present after indexing
          REQUIRED_SOURCES = ['epg.pw', 'skyhawk', 'tvepg']
          data = 'data'
          failures = []
          for fname, (label, min_ch) in {**REQUIRED, **REQUIRED_PLAIN}.items():
              p = os.path.join(data, fname)
              if not os.path.exists(p) or os.path.getsize(p) == 0:
                  failures.append(f'{label}: file missing/empty ({fname})'); continue
              try:
                  opener = gzip.open if fname.endswith('.gz') else open
                  txt = opener(p, 'rt', errors='ignore').read()
                  n = len(re.findall(r'<channel ', txt))
                  pr = len(re.findall(r'<programme', txt))
                  max_stop = max(re.findall(r'\bstop="(\d{8})', txt) or ['0'])
                  today = __import__('datetime').datetime.utcnow().strftime('%Y%m%d')
                  if n < min_ch or pr == 0:
                      failures.append(f'{label}: only {n} channels / {pr} programmes (<{min_ch})')
                  elif max_stop < today:
                      failures.append(f'{label}: stale-only feed (max stop {max_stop} < {today})')
                  else:
                      print(f'OK {label}: {n} channels, {pr} programmes, max stop {max_stop}')
              except Exception as e:
                  failures.append(f'{label}: unreadable ({e})')
          idx = json.load(open(os.path.join(data, 'sources_index.json')))
          for s in REQUIRED_SOURCES:
              if s not in idx or not idx[s]:
                  failures.append(f'source index missing: {s}')
              else:
                  print(f'OK source index: {s} ({len(idx[s])} names)')
          if failures:
              print('\n'.join('FAIL ' + f for f in failures))
              sys.exit(1)
          print('required-source gate passed')
          PYEOF

      - name: Build mapping (fallback cascade + country gating + call signs)
        run: |
          python3 pipeline/build_mapping.py \
            --streams data/streams.json \
            --sources-index data/sources_index.json \
            --provider-index data/provider_index.json \
            --callsigns data/call_signs.json \
            --us-affiliates pipeline/us_affiliates.json \
            --teams-claim data/teams_claim.json \
            -o data/mapping.json

      - name: Build final guide
        run: |
          python3 pipeline/build_pipeline.py \
            --streams data/streams.json \
            --mapping data/mapping.json \
            --sources data/sources.json \
            --provider data/provider.xml \
            --pk data/pk_epg.json \
            --out public/guide.xml.gz \
            --coverage-out data/coverage.json

      - name: Validate XMLTV
        run: |
          python3 - <<'PYEOF'
          import gzip, xml.dom.minidom, re, sys
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          xml.dom.minidom.parseString(d)
          chans = len(re.findall(r'<channel ', d))
          progs = len(re.findall(r'<programme', d))
          print(f'XMLTV VALID: {chans} channels, {progs} programmes')
          if chans < 1500 or progs < 100000:
              raise SystemExit('Coverage too low — aborting deploy')
          # AUDIT-8 P0 guard: numbered event slots are intentionally blank.
          event_channels = []
          for cm in re.finditer(r'<channel id="([^"]+)"[^>]*>(.*?)</channel>', d, re.S):
              cid, body = cm.group(1), cm.group(2)
              label = ' '.join(re.findall(r'<display-name[^>]*>([^<]*)</display-name>', body))
              if re.search(r'\b(?:NBA|MLB|UFC|PPV)\s*\d{1,2}\s*[|:]|\bNHL\s+Center\s+Ice\s*\d+|\(Events?\s+Only\)', label, re.I):
                  event_channels.append(cid)
          leaked = [cid for cid in event_channels if re.search(r'<programme[^>]*channel="'+re.escape(cid)+r'"', d)]
          if leaked:
              raise SystemExit('Event-only channels have programmes: '+', '.join(leaked[:20]))
          print(f'event-only guard passed: {len(event_channels)} blank event channels')
          PYEOF

      - name: Generate coverage report + drop alert
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import gzip, json, re, os, subprocess, io
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          new_chans = len(re.findall(r'<channel ', d))
          new_progs = len(re.findall(r'<programme', d))
          cov = json.load(open('data/coverage.json'))
          report = (
              f"EPG Coverage Report\n"
              f"===================\n"
              f"Linear channels covered: {cov['covered_channels']} / {cov['linear_unique_names']}\n"
              f"Channels in guide: {new_chans}\n"
              f"Programmes: {new_progs}\n"
              f"Selected streams: {cov.get('selected_streams', 'n/a')}\n"
              f"Quarantined overlaps/conflicts: {cov.get('overlap_rows_quarantined', 0)}/{cov.get('active_conflicts_quarantined', 0)}\n"
              f"Dropped bad rows: {cov.get('bad_rows_dropped', 0)}\n"
              f"Linear stream entries: {cov['linear_streams']} / {cov['total_streams']} total\n"
              f"Per-source: {json.dumps(cov['per_source'], sort_keys=True)}\n"
          )
          open('public/coverage.txt','w').write(report)
          print(report)

          # coverage-drop detection vs the currently deployed guide
          url = "https://shameez-struggles-to-commit.github.io/EPG/guide.xml.gz"
          prev_chans = 0
          try:
              tmp = '/tmp/prev_guide.xml.gz'
              subprocess.run(['curl','-sL','-A','Mozilla/5.0','-o',tmp,url],
                             capture_output=True, timeout=120)
              if os.path.exists(tmp) and os.path.getsize(tmp) > 0:
                  prev_chans = len(re.findall(r'<channel ', gzip.open(tmp,'rt',errors='ignore').read()))
          except Exception:
              prev_chans = 0
          drop = bool(prev_chans) and new_chans < prev_chans * 0.90
          print(f'deployed channels: {prev_chans}, new: {new_chans}, drop={drop}')

          if drop:
              ntfy = os.environ.get('NTFY_URL','')
              tok = os.environ.get('NTFY_TOKEN','')
              if ntfy and tok:
                  subprocess.run(['curl','-s','-H',f'Authorization: Bearer {tok}',
                                  '-d', f'⚠️ EPG coverage dropped: {new_chans} channels vs {prev_chans} deployed. Check the pipeline.',
                                  f'{ntfy}/hermes-shameez-a7f9c2'], timeout=30)
                  print('coverage-drop ntfy sent')
          PYEOF

      - name: Coverage gap audit (deterministic, deployed with the guide)
        run: |
          python3 pipeline/coverage_gaps.py \
            --streams data/streams.json \
            --mapping data/mapping.json \
            --sources data/sources.json \
            --sources-index data/sources_index.json \
            --coverage data/coverage.json \
            --out public/coverage_gaps.json \
            --prev-url https://shameez-struggles-to-commit.github.io/EPG/coverage_gaps.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health:
    runs-on: ubuntu-latest
    # Run after every trigger, not only the daily schedule. A push/manual build
    # can also publish a bad Pages object and must be checked before release is
    # considered healthy.
    needs: [build, deploy]
    steps:
      - name: Check deployed guide (fail on non-200/invalid)
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sIL -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -sL -o /tmp/guide.gz -w "%{size_download}" "$URL")
          echo "Guide URL: $URL"
          echo "Status: $STATUS | Size: $SIZE bytes"
          # AUDIT-4 F-02: health must ASSERT, not just print.
          if [ "$STATUS" != "200" ]; then echo "FAIL: HTTP $STATUS (expected 200)"; exit 1; fi
          if [ "$SIZE" -lt 1000000 ]; then echo "FAIL: guide implausibly small ($SIZE bytes)"; exit 1; fi
          python3 - <<'PYEOF'
          import gzip, re, sys, datetime
          d = gzip.open('/tmp/guide.gz','rt',errors='ignore').read()
          chans = len(re.findall(r'<channel ', d))
          progs = len(re.findall(r'<programme', d))
          print(f'deployed guide: {chans} channels, {progs} programmes')
          if chans < 1500 or progs < 100000:
              print('FAIL: deployed guide below minimums'); sys.exit(1)
          # current-data check: at least one programme must stop today or later
          today = datetime.date.today().strftime('%Y%m%d')
          import re as _re
          stops = _re.findall(r'stop="(\d{8})', d)
          if not stops or max(stops) < today:
              print(f'FAIL: no current programmes (max stop {max(stops) if stops else "none"} < {today})')
              sys.exit(1)
          print(f'OK: current data present (max stop {max(stops)})')
          PYEOF

      - name: Daily health ping (ntfy)
        if: github.run_attempt == 1
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL")
          curl -s --max-time 10 -H "Authorization: Bearer $NTFY_TOKEN" \
            -d "EPG Pipeline: guide.xml.gz HTTP $STATUS, ${SIZE} bytes — $(date -u)" \
            "$NTFY_URL/hermes-shameez-a7f9c2" || echo "ntfy ping failed (NTFY_URL may be unreachable from CI — check Tailscale/public endpoint)"
          echo "ntfy ping sent"
