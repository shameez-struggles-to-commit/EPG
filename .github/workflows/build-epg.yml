name: Build EPG Guide

on:
  schedule:
    # 04:00 UTC daily (midnight-ish for most timezones)
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/iptv-org-epg
          cd /tmp/iptv-org-epg && npm install --no-audit --no-fund

      - name: Fetch provider data (Xtream)
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: python3 pipeline/fetch_provider.py ./data

      - name: Run PK scrapers (Pakistan)
        run: python3 scrapers/pk_scrapers.py ./data/pk_epg.json

      - name: Run iptv-org grabber (India, per-site to avoid id collisions)
        run: |
          cd /tmp/iptv-org-epg
          npm run grab --- --sites=jiotv.com --maxConnections=4 --output=$GITHUB_WORKSPACE/data/io_jiotv.xml &
          npm run grab --- --sites=tataplay.com --maxConnections=4 --output=$GITHUB_WORKSPACE/data/io_tataplay.xml &
          npm run grab --- --sites=dishtv.in --maxConnections=4 --output=$GITHUB_WORKSPACE/data/io_dishtv.xml &
          npm run grab --- --sites=airtelxstream.in --maxConnections=4 --output=$GITHUB_WORKSPACE/data/io_airtel.xml &
          npm run grab --- --sites=zee5.com --maxConnections=4 --output=$GITHUB_WORKSPACE/data/io_zee5.xml &
          wait
          ls -la $GITHUB_WORKSPACE/data/io_*.xml

      - name: Download epg.pw + epgshare01 + index sources
        env:
          IPTV_ORG_FILES: "data/io_jiotv.xml,data/io_tataplay.xml,data/io_dishtv.xml,data/io_airtel.xml,data/io_zee5.xml"
        run: python3 pipeline/fetch_sources.py ./data

      - name: Build mapping (fallback cascade + country gating + call signs)
        run: |
          python3 pipeline/build_mapping.py \
            --streams data/streams.json \
            --sources-index data/sources_index.json \
            --provider-index data/provider_index.json \
            --callsigns data/call_signs.json \
            -o data/mapping.json

      - name: Build final guide
        run: |
          python3 pipeline/build_pipeline.py \
            --streams data/streams.json \
            --mapping data/mapping.json \
            --sources data/sources.json \
            --provider data/provider.xml \
            --pk data/pk_epg.json \
            --out public/guide.xml.gz \
            --coverage-out data/coverage.json

      - name: Validate XMLTV
        run: |
          python3 -c "
          import gzip, xml.dom.minidom, re
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          xml.dom.minidom.parseString(d)
          chans = len(re.findall(r'<channel ', d))
          progs = len(re.findall(r'<programme', d))
          print(f'XMLTV VALID: {chans} channels, {progs} programmes')
          if chans < 1500 or progs < 100000:
              raise SystemExit('Coverage too low — aborting deploy')
          "

      - name: Generate coverage report + drop alert
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import gzip, json, re, os, subprocess, io
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          new_chans = len(re.findall(r'<channel ', d))
          new_progs = len(re.findall(r'<programme', d))
          cov = json.load(open('data/coverage.json'))
          report = (
              f"EPG Coverage Report\n"
              f"===================\n"
              f"Linear channels covered: {cov['covered_channels']} / {cov['linear_unique_names']}\n"
              f"Channels in guide: {new_chans}\n"
              f"Programmes: {new_progs}\n"
              f"Linear stream entries: {cov['linear_streams']} / {cov['total_streams']} total\n"
              f"Per-source: {json.dumps(cov['per_source'], sort_keys=True)}\n"
          )
          open('public/coverage.txt','w').write(report)
          print(report)

          # coverage-drop detection vs the currently deployed guide
          url = "https://shameez-struggles-to-commit.github.io/EPG/guide.xml.gz"
          prev_chans = 0
          try:
              tmp = '/tmp/prev_guide.xml.gz'
              subprocess.run(['curl','-sL','-A','Mozilla/5.0','-o',tmp,url],
                             capture_output=True, timeout=120)
              if os.path.exists(tmp) and os.path.getsize(tmp) > 0:
                  prev_chans = len(re.findall(r'<channel ', gzip.open(tmp,'rt',errors='ignore').read()))
          except Exception:
              prev_chans = 0
          drop = bool(prev_chans) and new_chans < prev_chans * 0.90
          print(f'deployed channels: {prev_chans}, new: {new_chans}, drop={drop}')

          if drop:
              ntfy = os.environ.get('NTFY_URL','')
              tok = os.environ.get('NTFY_TOKEN','')
              if ntfy and tok:
                  subprocess.run(['curl','-s','-H',f'Authorization: Bearer {tok}',
                                  '-d', f'⚠️ EPG coverage dropped: {new_chans} channels vs {prev_chans} deployed. Check the pipeline.',
                                  f'{ntfy}/hermes-shameez-a7f9c2'], timeout=30)
                  print('coverage-drop ntfy sent')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: build
    steps:
      - name: Check deployed guide
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -sI -o /dev/null -w "%{size_download}" "$URL")
          echo "Guide URL: $URL"
          echo "Status: $STATUS"
          echo "Size: $SIZE bytes"

      - name: Daily health ping (ntfy)
        if: github.run_attempt == 1
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -sI -o /dev/null -w "%{size_download}" "$URL")
          curl -s -H "Authorization: Bearer $NTFY_TOKEN" \
            -d "EPG Pipeline: guide.xml.gz HTTP $STATUS, ${SIZE} bytes — $(date -u)" \
            "$NTFY_URL/hermes-shameez-a7f9c2" || true
          echo "ntfy ping sent"
