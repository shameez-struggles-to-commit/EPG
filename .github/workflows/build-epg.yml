name: Build EPG Guide

on:
  schedule:
    # 04:00 UTC daily (midnight-ish for most timezones)
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/iptv-org-epg
          cd /tmp/iptv-org-epg && npm install --no-audit --no-fund

      - name: Fetch provider data (Xtream)
        env:
          IPTV_SERVER: ${{ secrets.IPTV_SERVER }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
        run: python3 pipeline/fetch_provider.py ./data

      - name: Run PK scrapers (Pakistan)
        run: python3 scrapers/pk_scrapers.py ./data/pk_epg.json || echo "PK scraper(s) failed — see alert step"

      - name: Alert on PK scraper failure (no-LLM)
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess
          try:
              status = json.load(open('data/pk_status.json'))
          except Exception:
              status = {}
          failed = [k for k, s in status.items() if not s.get('ok')]
          if failed:
              msg = "⚠️ EPG PK scraper(s) failed: " + ", ".join(f"{k}={status[k]['count']}" for k in failed)
              ntfy = os.environ.get('NTFY_URL',''); tok = os.environ.get('NTFY_TOKEN','')
              if ntfy and tok:
                  try:
                      subprocess.run(['curl','-s','--max-time','10','-H','Authorization: Bearer '+tok,'-d',msg,f'{ntfy}/hermes-shameez-a7f9c2'], timeout=15)
                  except Exception as e:
                      print(f'ntfy send failed (non-fatal): {e}')
              print(msg)
          else:
              print('all PK scrapers OK')
          PYEOF

      - name: Generate filtered channel lists (non-India iptv-org sites)
        run: python3 pipeline/make_iptvorg_channels.py data/streams.json data/io_channels

      - name: "Fetch all EPG sources (parallel: India + non-India grabs + custom fetchers)"
        run: |
          cd /tmp/iptv-org-epg
          WS="$GITHUB_WORKSPACE"
          mkdir -p "$WS/data"

          # --- India per-site grabs (background; per-site to avoid id collisions) ---
          npm run grab --- --sites=jiotv.com --maxConnections=4 --output=$WS/data/io_jiotv.xml &
          npm run grab --- --sites=tataplay.com --maxConnections=4 --output=$WS/data/io_tataplay.xml &
          npm run grab --- --sites=dishtv.in --maxConnections=4 --output=$WS/data/io_dishtv.xml &
          npm run grab --- --sites=airtelxstream.in --maxConnections=4 --output=$WS/data/io_airtel.xml &
          npm run grab --- --sites=zee5.com --maxConnections=4 --output=$WS/data/io_zee5.xml &

          # --- remaining non-India sites (background, throttled) ---
          # NOTE: programtv.onet.pl was REMOVED 2026-08-16 — the official site
          # throttles ~1 req/s per IP (10+ min regardless of parallelism, even
          # across runner IPs). Polish channels are served by epgshare01 PL1
          # (free, ~22s download, ~150 channels) instead; the user confirmed
          # dropping the official PL source is fine.
          for site in tvpassport.com tv24.co.uk tvireland.ie www.magenta.tv web.magentatv.de tv.blue.ch abc.net.au foxtel.com.au tvhebdo.com programetv.ro programacion-tv.elpais.com movistarplus.es programme-tv.net tvcesoir.fr meo.pt guidatv.sky.it cosmotetv.gr cyta.com.cy allente.se epg.112114.xyz gigatv.3bbtv.co.th tvinsider.com tv24.se mujtvprogram.cz tvmustra.hu nostv.pt tv.trueid.net; do
            CH="$WS/data/io_channels/$site.channels.xml"
            if [ -s "$CH" ]; then
              npx tsx scripts/commands/epg/grab.ts --channels="$CH" --output="$WS/data/io_${site}.xml" --days=2 --timeout=30000 --maxConnections=10 &
            else
              echo "skip $site (empty filter)"
            fi
            # throttle: wait every 6 jobs
            if [ $(jobs -r | wc -l) -ge 6 ]; then wait -n; fi
          done

          # --- custom fetchers (background; only need streams.json) ---
          cd "$WS"
          python3 pipeline/fetch_skyhawk.py data/streams.json data/skyhawk.xml --days 2 &
          python3 pipeline/fetch_dstv.py data/dstv.xml --days 2 &
          (python3 pipeline/fetch_epgone.py data/epgone_cis.xml data/streams.json || echo "epg.one fetch failed (non-fatal: UA/MD bonus source)") &
          python3 pipeline/fetch_allente.py data/allente.xml --days 2 &
          python3 pipeline/fetch_teamfixtures.py data/streams.json data/teamfixtures.xml data/teams_status.json &
          python3 pipeline/fetch_bbcradio.py data/streams.json data/bbcradio.xml data/bbc_status.json --days 2 &

          wait
          echo "=== grab outputs ==="
          ls -la "$WS/data/io_*.xml" | head -50
          # sanity check: warn (non-fatal) about missing/empty grab outputs
          python3 - "$WS/data" <<'PYEOF'
          import os, sys
          d = sys.argv[1]
          expected = 'io_jiotv.xml io_tataplay.xml io_dishtv.xml io_airtel.xml io_zee5.xml io_tvpassport.com.xml io_tv24.co.uk.xml io_tvireland.ie.xml io_www.magenta.tv.xml io_web.magentatv.de.xml io_tv.blue.ch.xml io_abc.net.au.xml io_foxtel.com.au.xml io_tvhebdo.com.xml io_programetv.ro.xml io_programacion-tv.elpais.com.xml io_movistarplus.es.xml io_programme-tv.net.xml io_tvcesoir.fr.xml io_meo.pt.xml io_guidatv.sky.it.xml io_cosmotetv.gr.xml io_cyta.com.cy.xml io_allente.se.xml io_epg.112114.xyz.xml io_gigatv.3bbtv.co.th.xml io_tvinsider.com.xml io_tv24.se.xml io_mujtvprogram.cz.xml io_tvmustra.hu.xml io_nostv.pt.xml io_tv.trueid.net.xml'.split()
          missing = [f for f in expected if not os.path.exists(os.path.join(d, f)) or os.path.getsize(os.path.join(d, f)) < 1024]
          print(f'WARN: {len(missing)} grab outputs missing/empty: {missing}' if missing else 'all grab outputs present')
          PYEOF

      - name: Download epg.pw + epgshare01 + index sources
        env:
          IPTV_ORG_FILES: "data/io_jiotv.xml,data/io_tataplay.xml,data/io_dishtv.xml,data/io_airtel.xml,data/io_zee5.xml,data/io_tvpassport.com.xml,data/io_tv24.co.uk.xml,data/io_tvireland.ie.xml,data/io_www.magenta.tv.xml,data/io_web.magentatv.de.xml,data/io_tv.blue.ch.xml,data/io_abc.net.au.xml,data/io_foxtel.com.au.xml,data/io_tvhebdo.com.xml,data/io_programetv.ro.xml,data/io_programacion-tv.elpais.com.xml,data/io_movistarplus.es.xml,data/io_programme-tv.net.xml,data/io_tvcesoir.fr.xml,data/io_meo.pt.xml,data/io_guidatv.sky.it.xml,data/io_cosmotetv.gr.xml,data/io_cyta.com.cy.xml,data/io_allente.se.xml,data/io_epg.112114.xyz.xml,data/io_gigatv.3bbtv.co.th.xml,data/io_tvinsider.com.xml,data/io_tv24.se.xml,data/io_mujtvprogram.cz.xml,data/io_tvmustra.hu.xml,data/io_nostv.pt.xml,data/io_tv.trueid.net.xml"
          SKYHAWK_FILE: "data/skyhawk.xml"
          DSTV_FILE: "data/dstv.xml"
          EPGONE_FILE: "data/epgone_cis.xml"
          ALLENTE_FILE: "data/allente.xml"
          TEAMS_FILE: "data/teamfixtures.xml"
          BBCRADIO_FILE: "data/bbcradio.xml"
        run: python3 pipeline/fetch_sources.py ./data

      - name: Build mapping (fallback cascade + country gating + call signs)
        run: |
          python3 pipeline/build_mapping.py \
            --streams data/streams.json \
            --sources-index data/sources_index.json \
            --provider-index data/provider_index.json \
            --callsigns data/call_signs.json \
            --us-affiliates pipeline/us_affiliates.json \
            -o data/mapping.json

      - name: Build final guide
        run: |
          python3 pipeline/build_pipeline.py \
            --streams data/streams.json \
            --mapping data/mapping.json \
            --sources data/sources.json \
            --provider data/provider.xml \
            --pk data/pk_epg.json \
            --out public/guide.xml.gz \
            --coverage-out data/coverage.json

      - name: Validate XMLTV
        run: |
          python3 -c "
          import gzip, xml.dom.minidom, re
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          xml.dom.minidom.parseString(d)
          chans = len(re.findall(r'<channel ', d))
          progs = len(re.findall(r'<programme', d))
          print(f'XMLTV VALID: {chans} channels, {progs} programmes')
          if chans < 1500 or progs < 100000:
              raise SystemExit('Coverage too low — aborting deploy')
          "

      - name: Generate coverage report + drop alert
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import gzip, json, re, os, subprocess, io
          d = gzip.open('public/guide.xml.gz','rt',errors='ignore').read()
          new_chans = len(re.findall(r'<channel ', d))
          new_progs = len(re.findall(r'<programme', d))
          cov = json.load(open('data/coverage.json'))
          report = (
              f"EPG Coverage Report\n"
              f"===================\n"
              f"Linear channels covered: {cov['covered_channels']} / {cov['linear_unique_names']}\n"
              f"Channels in guide: {new_chans}\n"
              f"Programmes: {new_progs}\n"
              f"Linear stream entries: {cov['linear_streams']} / {cov['total_streams']} total\n"
              f"Per-source: {json.dumps(cov['per_source'], sort_keys=True)}\n"
          )
          open('public/coverage.txt','w').write(report)
          print(report)

          # coverage-drop detection vs the currently deployed guide
          url = "https://shameez-struggles-to-commit.github.io/EPG/guide.xml.gz"
          prev_chans = 0
          try:
              tmp = '/tmp/prev_guide.xml.gz'
              subprocess.run(['curl','-sL','-A','Mozilla/5.0','-o',tmp,url],
                             capture_output=True, timeout=120)
              if os.path.exists(tmp) and os.path.getsize(tmp) > 0:
                  prev_chans = len(re.findall(r'<channel ', gzip.open(tmp,'rt',errors='ignore').read()))
          except Exception:
              prev_chans = 0
          drop = bool(prev_chans) and new_chans < prev_chans * 0.90
          print(f'deployed channels: {prev_chans}, new: {new_chans}, drop={drop}')

          if drop:
              ntfy = os.environ.get('NTFY_URL','')
              tok = os.environ.get('NTFY_TOKEN','')
              if ntfy and tok:
                  subprocess.run(['curl','-s','-H',f'Authorization: Bearer {tok}',
                                  '-d', f'⚠️ EPG coverage dropped: {new_chans} channels vs {prev_chans} deployed. Check the pipeline.',
                                  f'{ntfy}/hermes-shameez-a7f9c2'], timeout=30)
                  print('coverage-drop ntfy sent')
          PYEOF

      - name: Coverage gap audit (deterministic, deployed with the guide)
        run: |
          python3 pipeline/coverage_gaps.py \
            --streams data/streams.json \
            --mapping data/mapping.json \
            --sources data/sources.json \
            --sources-index data/sources_index.json \
            --coverage data/coverage.json \
            --out public/coverage_gaps.json \
            --prev-url https://shameez-struggles-to-commit.github.io/EPG/coverage_gaps.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: build
    steps:
      - name: Check deployed guide
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL")
          echo "Guide URL: $URL"
          echo "Status: $STATUS"
          echo "Size: $SIZE bytes"

      - name: Daily health ping (ntfy)
        if: github.run_attempt == 1
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/EPG/guide.xml.gz"
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
          SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL")
          curl -s --max-time 10 -H "Authorization: Bearer $NTFY_TOKEN" \
            -d "EPG Pipeline: guide.xml.gz HTTP $STATUS, ${SIZE} bytes — $(date -u)" \
            "$NTFY_URL/hermes-shameez-a7f9c2" || echo "ntfy ping failed (NTFY_URL may be unreachable from CI — check Tailscale/public endpoint)"
          echo "ntfy ping sent"
